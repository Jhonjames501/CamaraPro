<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CAMARA PRO</title>
<style>
/* Tu style.css va aquí - lo mantengo en negro como me pediste */
body{margin:0;background:#000;color:#fff;font-family:sans-serif;overflow:hidden}
#camera{width:100vw;height:100vh;object-fit:cover}
#controls{position:fixed;bottom:20px;width:100%;display:flex;justify-content:center;gap:20px}
button{width:70px;height:70px;border-radius:50%;border:3px solid #00A8FF;background:#111;color:#fff;font-size:30px}
</style>
</head>
<body>
<video id="camera" autoplay playsinline></video>
<canvas id="canvas" style="display:none"></canvas>

<div id="controls">
  <button id="btnShot">📸</button>
  <button id="btnSwitch">🔄</button>
</div>

<!-- ESTO ES LA CLAVE PARA QUE FUNCIONE EN APK -->
<input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none">

<script>
const video = document.getElementById('camera');
const canvas = document.getElementById('canvas');
const fileInput = document.getElementById('fileInput');
let useNative = false;
let currentFacing = "environment";

// Intenta abrir cámara web
async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: currentFacing, width: {ideal: 1920}, height: {ideal: 1080} }
    });
    video.srcObject = stream;
    useNative = false;
  } catch (e) {
    // Si falla (caso AppGeyser), usa input nativo
    console.log("WebView detectado, usando camara nativa");
    useNative = true;
    fileInput.click();
  }
}

document.getElementById('btnShot').onclick = () => {
  if (useNative) {
    fileInput.click();
  } else {
    // Foto normal web
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const data = canvas.toDataURL('image/jpeg');
    // Guarda o muestra
    const a = document.createElement('a');
    a.href = data;
    a.download = `CAMARA_PRO_${Date.now()}.jpg`;
    a.click();
  }
};

fileInput.onchange = (e) => {
  const file = e.target.files[0];
  if(file){
    const url = URL.createObjectURL(file);
    // Muestra la foto tomada
    const img = new Image();
    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;
      canvas.getContext('2d').drawImage(img, 0, 0);
      // Aquí puedes guardarla
      alert("Foto tomada: " + file.name);
    };
    img.src = url;
  }
};

document.getElementById('btnSwitch').onclick = () => {
  currentFacing = currentFacing === "environment"? "user" : "environment";
  if(video.srcObject) video.srcObject.getTracks().forEach(t=>t.stop());
  initCamera();
};

initCamera();
</script>
</body>
</html>
